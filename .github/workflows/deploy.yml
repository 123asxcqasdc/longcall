name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          for file in js/*.js tools/*.js electron/*.cjs; do
            node --check "$file"
          done
          test -s vendor/firebase.js
          echo "syntax ok"

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.firebaserc' \
            --exclude 'node_modules' \
            --exclude 'tools' \
            --exclude 'electron' \
            --exclude 'release' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'database.rules.json' \
            --exclude 'firebase.json' \
            ./ _site/
          ls -la _site

      # Pages нельзя включить токеном интеграции: это делает владелец репозитория
      # в Settings → Pages. Пока сайт не включён, сборка остаётся зелёной,
      # а в логе появляется подсказка.
      - name: Check that GitHub Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "Pages API status: $status"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages ещё не включён::Settings → Pages → Source: GitHub Actions, затем Actions → Deploy to GitHub Pages → Re-run jobs."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
