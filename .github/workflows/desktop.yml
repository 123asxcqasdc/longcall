name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            flag: --linux
            artifact: longcall-linux
            paths: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            name: Windows
            flag: --win
            artifact: longcall-windows
            paths: |
              release/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sources
        shell: bash
        run: |
          for file in js/*.js electron/*.cjs; do node --check "$file"; done
          test -s vendor/firebase.js
          test -s electron/icons/512x512.png
          # .deb/.rpm требуют e-mail мейнтейнера, иначе electron-builder падает
          node -e "const p=require('./package.json'); if(!p.author||!p.author.email) throw new Error('package.json: author.email обязателен'); if(!p.build.linux.maintainer) throw new Error('package.json: build.linux.maintainer обязателен');"
          echo "sources ok"

      - name: Package
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check packaged files
        shell: bash
        run: |
          ls -la release
          if [ "${{ matrix.flag }}" = "--win" ]; then
            # установщик и portable — два разных файла, иначе они затирают друг друга
            test "$(ls release/*.exe | wc -l)" -ge 2 || { echo "ожидалось 2 .exe, найдено $(ls release/*.exe | wc -l)"; exit 1; }
          else
            test "$(ls release/*.AppImage | wc -l)" -ge 1
            test "$(ls release/*.deb | wc -l)" -ge 1
          fi
          echo "artifacts ok"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # нужен, чтобы прочитать RELEASE_NOTES.md для body_path
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: LongCall 98 — ${{ github.ref_name }}
          # Заметки берём из файла: автогенерация дописывала новый блок
          # «What's Changed» при каждом пересборке релиза.
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
